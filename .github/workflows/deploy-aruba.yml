name: Deploy to Aruba FTP

# Il trigger: la pipeline parte in automatico ad ogni push sul branch 'main'
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizzazione FTP
    runs-on: ubuntu-latest

    steps:
      # Task 1: Effettua il checkout del codice sul runner
      - name: Checkout del codice
        uses: actions/checkout@v4

      # Task 2: Builda l'app (senza questo step si carica il sorgente, non il sito compilato)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Task 3: Carica su Aruba solo il contenuto compilato (dist/)
      # Si usa lftp invece di FTP-Deploy-Action perché quell'action fallisce
      # nella creazione di sottocartelle su questo FTP Aruba (errore 550 su mkdir+cwd).
      - name: Deploy su Aruba via FTP (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '\r\n' | xargs)
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n' | xargs)
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          # Rimuove un eventuale prefisso di schema (ftp://, ftps://) e slash finale,
          # nel caso il valore sia stato copiato come URL invece che come hostname puro.
          FTP_SERVER=${FTP_SERVER#ftp://}
          FTP_SERVER=${FTP_SERVER#ftps://}
          FTP_SERVER=${FTP_SERVER%/}
          # Importante: nessun argomento va racchiuso tra virgolette nel comando "open"
          # di lftp: lftp non le rimuove e le invia letteralmente al server (verificato
          # con un finto server FTP: "USER \"utente\"" invece di "USER utente"), causando
          # sia il fallimento DNS sull'host sia il rifiuto di login su utente/password.
          #
          # La home FTP contiene le cartelle di più domini (è un account multi-dominio):
          # la webroot pubblica di questo dominio è la sottocartella www.rockhistory.eu/,
          # non la radice (la radice stessa nega la scrittura con "550 Permission denied").
          # Il file CSS arrivava troncato a esattamente 16384 byte (2^14): è la
          # dimensione massima di un singolo record TLS. lftp negozia AUTH TLS
          # automaticamente quando il server la supporta, e su questo server c'è
          # evidentemente un bug nella gestione dei record TLS successivi al primo
          # sul canale dati per trasferimenti più grandi di un record. Disabilita
          # del tutto la negoziazione TLS (ftp:ssl-allow no) per usare FTP semplice,
          # eliminando il canale dati cifrato che causava il troncamento.
          # Mantiene comunque il trasferimento sequenziale e una doppia passata di
          # mirror come verifica extra sulle dimensioni dei file.
          lftp -e "
            set net:timeout 15;
            set net:max-retries 2;
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mirror --reverse --verbose --delete ./dist/ ./www.rockhistory.eu/;
            mirror --reverse --verbose --delete ./dist/ ./www.rockhistory.eu/;
            bye
          "
          echo "== Verifica dimensioni dopo il deploy =="
          echo "-- locali --"
          ls -la ./dist/assets/
          echo "-- remote --"
          lftp -e "
            set net:timeout 15;
            set net:max-retries 2;
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            cd www.rockhistory.eu/assets;
            ls -la;
            bye
          "

      - name: Verifica diagnostica sito live
        run: |
          echo "== Headers https://www.rockhistory.eu/ (no-cache) =="
          curl -sI --max-time 15 -H "Cache-Control: no-cache" -H "Pragma: no-cache" https://www.rockhistory.eu/ || echo "CURL FALLITO"
          echo "== HTML completo live =="
          HTML=$(curl -s --max-time 15 -H "Cache-Control: no-cache" -H "Pragma: no-cache" https://www.rockhistory.eu/)
          echo "$HTML"
          LIVE_JS=$(echo "$HTML" | grep -o '/assets/index-[^"]*\.js' | head -1)
          LIVE_CSS=$(echo "$HTML" | grep -o '/assets/index-[^"]*\.css' | head -1)
          echo "== File JS referenziato dall'HTML live: $LIVE_JS =="
          echo "== File CSS referenziato dall'HTML live: $LIVE_CSS =="
          echo "== Headers per quel file JS (quello che il browser richiede davvero) =="
          curl -sI --max-time 15 "https://www.rockhistory.eu${LIVE_JS}" || echo "CURL FALLITO"
          echo "== Headers per quel file CSS (quello che il browser richiede davvero) =="
          curl -sI --max-time 15 "https://www.rockhistory.eu${LIVE_CSS}" || echo "CURL FALLITO"
          echo "== Listato remoto attuale della cartella assets (cosa esiste davvero sul server) =="
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '\r\n' | xargs)
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n' | xargs)
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          FTP_SERVER=${FTP_SERVER#ftp://}
          FTP_SERVER=${FTP_SERVER#ftps://}
          FTP_SERVER=${FTP_SERVER%/}
          lftp -e "
            set net:timeout 15;
            set net:max-retries 2;
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            cd www.rockhistory.eu;
            cat index.html;
            bye
          "
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
