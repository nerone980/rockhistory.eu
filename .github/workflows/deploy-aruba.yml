name: Deploy to Aruba FTP

# Il trigger: la pipeline parte in automatico ad ogni push sul branch 'main'
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizzazione FTP
    runs-on: ubuntu-latest

    steps:
      # Task 1: Effettua il checkout del codice sul runner
      - name: Checkout del codice
        uses: actions/checkout@v4

      # Task 2: Builda l'app (senza questo step si carica il sorgente, non il sito compilato)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Task 3: Carica su Aruba solo il contenuto compilato (dist/)
      - name: Sincronizzazione FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # La webroot dell'hosting Aruba collegato al dominio è la radice dell'account FTP
          server-dir: /
