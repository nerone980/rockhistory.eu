name: Aggiorna dati Spotify

# Recupera copertine album, foto band e link alle tracce da Spotify e
# committa il risultato in src/data/spotifyCovers.generated.json. Gira
# su una schedule separata (non ad ogni deploy) perché una scansione
# completa del catalogo (~100 band, centinaia di album) può richiedere
# molte chiamate all'API e va soggetta a rate-limiting; i deploy normali
# (deploy-aruba.yml) si limitano a usare l'ultimo file già committato.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-spotify-data
  cancel-in-progress: false

jobs:
  fetch:
    name: Recupera e committa i dati Spotify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recupera copertine, foto band e link tracce da Spotify
        env:
          SPOTIFY_CLIENTID: ${{ secrets.SPOTIFY_CLIENTID }}
          SPOTIFY_SECRET: ${{ secrets.SPOTIFY_SECRET }}
        run: npm run fetch-spotify-covers

      - name: Committa se ci sono cambiamenti
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/spotifyCovers.generated.json; then
            echo "Nessuna modifica ai dati Spotify, niente da committare."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git add src/data/spotifyCovers.generated.json
            git commit -m "Aggiorna dati Spotify (copertine, foto band, link tracce)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push fatto con il GITHUB_TOKEN di default non attiva altri
      # workflow (per evitare loop infiniti) — quindi il "on: push" di
      # deploy-aruba.yml non scatterebbe mai per il commit sopra. Lo
      # attiviamo esplicitamente via workflow_dispatch, che invece è
      # permesso con il GITHUB_TOKEN.
      - name: Attiva il deploy con i nuovi dati
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-aruba.yml --ref main
